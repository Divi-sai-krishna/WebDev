<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Calculator</title>
<style>
:root{--bg:#e9eef0;--body:#f8fafb;--screen:#16252b;--screen-ink:#eaf4f7;--screen-dim:#8aa3ab;--key:#ffffff;--key-ink:#16252b;--op:#d9e8ee;--accent:#1f6f8b;--accent-ink:#fff;--clear:#c2483d;--shadow:rgba(22,37,43,.25)}
@media (prefers-color-scheme:dark){:root{--bg:#0d1417;--body:#18232a;--screen:#0b1114;--key:#22323a;--key-ink:#e6eef0;--op:#2c4651;--accent:#5fb4d1;--accent-ink:#0b1316;--clear:#e0675c;--shadow:rgba(0,0,0,.6)}}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:grid;place-items:center;background:var(--bg);font-family:"Avenir Next","Segoe UI",system-ui,sans-serif;padding:16px}
.calc{width:100%;max-width:340px;background:var(--body);border-radius:24px;padding:18px;box-shadow:0 24px 50px -16px var(--shadow)}
.screen{background:var(--screen);color:var(--screen-ink);border-radius:14px;padding:16px 18px;min-height:112px;display:flex;flex-direction:column;justify-content:flex-end;align-items:flex-end;overflow:hidden;margin-bottom:16px}
.expr{font-size:1.5rem;color:var(--screen-dim);min-height:2rem;max-width:100%;overflow-x:auto;white-space:nowrap}
.result{font-size:2.4rem;font-weight:600;min-height:3rem;max-width:100%;overflow-x:auto;white-space:nowrap;transition:opacity .15s}
.result.err{color:var(--clear);font-size:1.5rem}
.keys{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
button{font:inherit;font-size:1.35rem;height:60px;border:0;border-radius:14px;background:var(--key);color:var(--key-ink);cursor:pointer;box-shadow:0 2px 0 var(--shadow);transition:transform .08s,filter .15s,box-shadow .08s}
button:hover{filter:brightness(.95)}
button:active,button.pressed{transform:translateY(2px);box-shadow:none}
button.op{background:var(--op)}
button.eq{background:var(--accent);color:var(--accent-ink);grid-row:span 2;height:auto}
button.clr{color:var(--clear)}
button.zero{grid-column:span 2}
button:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
</style>
</head>
<body>
<div class="calc">
  <div class="screen" aria-live="polite">
    <div class="expr" id="expr"></div>
    <div class="result" id="result">0</div>
  </div>
  <div class="keys" id="keys">
    <button class="clr" data-k="C" aria-label="Clear">C</button>
    <button class="op" data-k="Backspace" aria-label="Delete last">⌫</button>
    <button class="op" data-k="%" aria-label="Percent">%</button>
    <button class="op" data-k="/" aria-label="Divide">÷</button>
    <button data-k="7">7</button><button data-k="8">8</button><button data-k="9">9</button>
    <button class="op" data-k="*" aria-label="Multiply">×</button>
    <button data-k="4">4</button><button data-k="5">5</button><button data-k="6">6</button>
    <button class="op" data-k="-" aria-label="Subtract">−</button>
    <button data-k="1">1</button><button data-k="2">2</button><button data-k="3">3</button>
    <button class="op" data-k="+" aria-label="Add">+</button>
    <button class="zero" data-k="0">0</button><button data-k=".">.</button>
    <button class="eq" data-k="=" aria-label="Equals" style="grid-column:4;grid-row:5 / span 1;height:60px">=</button>
  </div>
</div>

<script>
const exprEl = document.getElementById("expr");
const resEl = document.getElementById("result");
const SYM = { "*": "×", "/": "÷", "-": "−", "+": "+" };
let expr = "";        // internal: digits . + - * / %
let justEvaluated = false;

// Safe evaluator: tokens -> precedence parser (no eval)
function evaluate(s) {
  const tokens = s.match(/\d*\.?\d+%*|\d+\.?%*|[+\-*/]/g);
  if (!tokens) return null;
  let pos = 0;
  const peek = () => tokens[pos];
  const num = () => {
    let t = peek();
    if (t === "-") { pos++; return -num(); }
    if (t === "+") { pos++; return num(); }
    if (t === undefined || /[*/]/.test(t)) throw new Error("Invalid");
    pos++;
    let pct = (t.match(/%/g) || []).length;
    let v = parseFloat(t);
    while (pct--) v /= 100;
    return v;
  };
  const term = () => {
    let v = num();
    while (peek() === "*" || peek() === "/") {
      const op = tokens[pos++];
      const r = num();
      if (op === "/" && r === 0) throw new Error("Cannot divide by 0");
      v = op === "*" ? v * r : v / r;
    }
    return v;
  };
  const sum = () => {
    let v = term();
    while (peek() === "+" || peek() === "-") {
      const op = tokens[pos++];
      const r = term();
      v = op === "+" ? v + r : v - r;
    }
    return v;
  };
  const out = sum();
  if (pos < tokens.length) throw new Error("Invalid");
  return out;
}

const fmt = n => {
  if (!isFinite(n)) return "Error";
  return String(parseFloat(n.toPrecision(12)));
};

function render() {
  exprEl.textContent = expr.replace(/[*\/\-+]/g, c => " " + SYM[c] + " ").trim();
  resEl.classList.remove("err");
  if (!expr) { resEl.textContent = "0"; return; }
  try {
    const v = evaluate(expr);
    resEl.textContent = v === null ? "0" : fmt(v);
  } catch (e) {
    // Live preview: stay quiet for half-typed input like "5+"; show real errors only for divide by zero
    if (e.message.startsWith("Cannot")) { resEl.textContent = e.message; resEl.classList.add("err"); }
  }
}

function press(k) {
  const isOp = /[+\-*/]/.test(k);
  const last = expr.slice(-1);

  if (k === "C") { expr = ""; justEvaluated = false; return render(); }
  if (k === "Backspace") { expr = expr.slice(0, -1); justEvaluated = false; return render(); }

  if (k === "=" || k === "Enter") {
    if (!expr) return;
    try {
      const v = evaluate(expr);
      expr = v === null ? "" : fmt(v);
      if (expr === "Error") expr = "";
      justEvaluated = true;
      exprEl.textContent = "";
      resEl.textContent = expr || "0";
    } catch (e) {
      resEl.textContent = e.message;
      resEl.classList.add("err");
    }
    return;
  }

  if (/\d/.test(k)) {
    if (justEvaluated) { expr = ""; justEvaluated = false; }
    if (last === "%") return;
    // avoid leading zeros like "007"
    const cur = expr.split(/[+\-*/]/).pop();
    if (cur === "0" && k !== "0") expr = expr.slice(0, -1);
    else if (cur === "0" && k === "0") return;
    expr += k;
  } else if (k === ".") {
    if (justEvaluated) { expr = ""; justEvaluated = false; }
    const cur = expr.split(/[+\-*/]/).pop();
    if (cur.includes(".")) return;
    expr += cur === "" || last === "%" ? (last === "%" ? "" : "0.") : ".";
  } else if (k === "%") {
    if (!/[\d.]/.test(last) && last !== "%") return;
    justEvaluated = false;
    expr += "%";
  } else if (isOp) {
    justEvaluated = false;
    if (!expr) { if (k === "-") expr = "-"; return render(); }
    if (/[+\-*/]/.test(last)) {
      // replace operator, but allow a leading minus after × or ÷
      if (k === "-" && /[*/]/.test(last)) expr += k;
      else expr = expr.replace(/[+\-*/]+$/, "") + k;
    } else expr += k;
  }
  render();
}

// Click handling
document.getElementById("keys").addEventListener("click", e => {
  const b = e.target.closest("button");
  if (b) press(b.dataset.k);
});

// Keyboard support
document.addEventListener("keydown", e => {
  let k = e.key;
  if (e.ctrlKey || e.metaKey || e.altKey) return;
  if (k === "Enter") { e.preventDefault(); k = "="; }
  if (k === "Escape" || k.toLowerCase() === "c") k = "C";
  if (k === "x" || k === "X") k = "*";
  if (k === ",") k = ".";
  if (!/^(\d|[+\-*/.%=]|Backspace|C)$/.test(k)) return;
  e.preventDefault();
  press(k);
  const btn = document.querySelector(`button[data-k="${CSS.escape(k)}"]`);
  if (btn) { btn.classList.add("pressed"); setTimeout(() => btn.classList.remove("pressed"), 100); }
});

render();
</script>
</body>
</html>
