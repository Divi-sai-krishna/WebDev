<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Four Horizons – Image Gallery</title>
<style>
:root{--bg:#eef2f3;--ink:#16252b;--muted:#5b6c73;--line:#cfd9dc;--accent:#1f6f8b;--onaccent:#fff;--shadow:rgba(22,37,43,.28);
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#10181b;--ink:#e6eef0;--muted:#93a6ad;--line:#27373d;--accent:#5fb4d1;--onaccent:#0b1316;--shadow:rgba(0,0,0,.6);color-scheme:dark}}
:root[data-theme="dark"]{--bg:#10181b;--ink:#e6eef0;--muted:#93a6ad;--line:#27373d;--accent:#5fb4d1;--onaccent:#0b1316;--shadow:rgba(0,0,0,.6);color-scheme:dark}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Avenir Next",Avenir,"Segoe UI",system-ui,sans-serif;line-height:1.5}
header{max-width:1200px;margin:0 auto;padding:48px 20px 20px}
h1{font-family:Georgia,"Iowan Old Style",serif;font-weight:400;font-size:clamp(2rem,6vw,3.4rem);letter-spacing:-.02em;margin:0 0 8px;line-height:1.1}
header p{margin:0;color:var(--muted);max-width:52ch}
.filters{max-width:1200px;margin:0 auto;padding:12px 20px 20px;display:flex;flex-wrap:wrap;gap:8px}
.filters button{font:inherit;font-size:.9rem;padding:8px 16px;border-radius:999px;border:1px solid var(--line);background:transparent;color:var(--ink);cursor:pointer;transition:background .25s,color .25s,border-color .25s,transform .2s}
.filters button:hover{border-color:var(--accent);transform:translateY(-1px)}
.filters button[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--onaccent)}
.grid{max-width:1200px;margin:0 auto;padding:0 20px 60px;display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));grid-auto-rows:190px;grid-auto-flow:dense;gap:14px}
.item{position:relative;overflow:hidden;border:0;padding:0;border-radius:10px;cursor:pointer;background:var(--line);opacity:1;transform:scale(1);transition:opacity .3s ease,transform .3s ease,box-shadow .3s ease}
.item.wide{grid-column:span 2}.item.tall{grid-row:span 2}
.item.out{opacity:0;transform:scale(.92)}
.item[hidden]{display:none}
.item img{width:100%;height:100%;object-fit:cover;display:block;transition:transform .6s cubic-bezier(.2,.7,.2,1)}
.item:hover,.item:focus-visible{box-shadow:0 14px 30px -10px var(--shadow)}
.item:hover img,.item:focus-visible img{transform:scale(1.08)}
.item .cap{position:absolute;inset:auto 0 0 0;padding:28px 14px 12px;text-align:left;color:#fff;background:linear-gradient(transparent,rgba(0,0,0,.6));transform:translateY(100%);transition:transform .35s ease}
.item:hover .cap,.item:focus-visible .cap{transform:translateY(0)}
.cap b{display:block;font-weight:600}.cap span{font-size:.8rem;opacity:.85}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
@media (max-width:520px){.grid{grid-template-columns:repeat(2,1fr);grid-auto-rows:150px;gap:10px}.item.wide{grid-column:span 2}.item .cap{transform:translateY(0)}}
/* lightbox */
.lb{position:fixed;inset:0;z-index:50;display:grid;place-items:center;background:rgba(8,12,14,.92);opacity:0;visibility:hidden;transition:opacity .3s,visibility .3s;padding:env(safe-area-inset-top,0px) 0 env(safe-area-inset-bottom,0px)}
.lb.open{opacity:1;visibility:visible}
.lb figure{margin:0;max-width:min(92vw,1100px);text-align:center;color:#fff}
.lb img{max-width:100%;max-height:74vh;border-radius:8px;transition:opacity .25s,transform .25s;box-shadow:0 20px 60px rgba(0,0,0,.5)}
.lb img.swap{opacity:0;transform:scale(.97)}
.lb figcaption{margin-top:14px}.lb figcaption small{display:block;opacity:.7}
.lb button{position:absolute;border:0;background:rgba(255,255,255,.12);color:#fff;width:48px;height:48px;border-radius:50%;font-size:1.5rem;cursor:pointer;transition:background .2s,transform .2s}
.lb button:hover{background:rgba(255,255,255,.28);transform:scale(1.08)}
.lb .prev{left:16px;top:50%;margin-top:-24px}.lb .next{right:16px;top:50%;margin-top:-24px}
.lb .close{top:calc(14px + env(safe-area-inset-top,0px));right:16px}
@media (prefers-reduced-motion:reduce){*{transition-duration:.01ms!important}}
</style>
</head>
<body>
<header>
<h1>Four horizons</h1>
<p>Twelve generated landscapes across mountains, ocean, desert and forest. Filter by place, then open any picture to browse in full.</p>
</header>
<nav class="filters" id="filters" aria-label="Filter by category"></nav>
<main class="grid" id="grid"></main>

<div class="lb" id="lb" role="dialog" aria-modal="true" aria-label="Image viewer">
<button class="close" id="close" aria-label="Close viewer">×</button>
<button class="prev" id="prev" aria-label="Previous image">‹</button>
<button class="next" id="next" aria-label="Next image">›</button>
<figure><img id="lbimg" alt=""><figcaption><b id="lbt"></b><small id="lbm"></small></figcaption></figure>
</div>

<script>
// Seeded random so each picture is stable
function rng(s){return function(){s=(s*9301+49297)%233280;return s/233280}}
const PAL={
 Mountains:[["#f6c8a0","#7a8fb8"],["#bcd3e8","#3d5a80"],["#f2a9a0","#5b4b8a"]],
 Ocean:[["#ffd9a0","#2f7fa8"],["#cfeaf2","#145a7a"],["#f6b8a8","#2b5f8f"]],
 Desert:[["#ffe0a8","#c96f3b"],["#f8c9a0","#a6502e"],["#fbe7b8","#d49a4a"]],
 Forest:[["#d6e8c8","#2f6b4a"],["#bfd8c4","#1f4f43"],["#f0e2b0","#3d7a3f"]]
};
function scene(cat,i,w,h){
 const r=rng(i*77+cat.length*13),p=PAL[cat][i%3],W=w,H=h;
 let s=`<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 ${W} ${H}"><defs><linearGradient id="g" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="${p[0]}"/><stop offset="1" stop-color="#fff" stop-opacity=".9"/></linearGradient></defs><rect width="${W}" height="${H}" fill="url(#g)"/>`;
 s+=`<circle cx="${W*(.2+r()*.6)}" cy="${H*(.2+r()*.15)}" r="${H*.07}" fill="#fff" opacity=".85"/>`;
 const layers=4;
 for(let l=0;l<layers;l++){
  const base=H*(.45+l*.13),shade=1-l*.22,col=mix(p[1],l/layers);
  let d=`M0 ${H} L0 ${base}`;
  if(cat==="Mountains"){for(let x=0;x<=W;x+=W/6){d+=` L${x} ${base-r()*H*(.3-l*.05)}`}}
  else if(cat==="Ocean"){const a=H*.02*(l+1);for(let x=0;x<=W;x+=20){d+=` L${x} ${base+Math.sin(x/(60+l*20)+l)*a}`}}
  else if(cat==="Desert"){const a=H*.06;for(let x=0;x<=W;x+=20){d+=` L${x} ${base-a*(1+Math.sin(x/(110-l*10)+l*2))*(0.6+r()*.1)}`}}
  else{for(let x=0;x<=W;x+=W/14){const t=H*(.12+r()*.1);d+=` L${x} ${base} L${x+W/28} ${base-t} L${x+W/14} ${base}`}}
  s+=`<path d="${d} L${W} ${H} Z" fill="${col}" opacity="${.55+l*.15}"/>`;
 }
 return s+"</svg>";
}
function mix(hex,t){ // blend hex toward dark
 const n=parseInt(hex.slice(1),16),c=[n>>16,(n>>8)&255,n&255].map(v=>Math.round(v*(1-t*.5)));
 return "#"+c.map(v=>v.toString(16).padStart(2,"0")).join("");
}
const data=[];
const names={Mountains:["Alpine dawn","Blue ridges","Rose summit"],Ocean:["Golden tide","Quiet bay","Coral sunset"],Desert:["Amber dunes","Red mesa","Dry horizon"],Forest:["Mossy canopy","Deep pines","Clearing light"]};
const shapes=["","wide","tall"];
Object.keys(names).forEach((c,ci)=>names[c].forEach((t,i)=>{
 const sh=shapes[(ci+i)%3==0?1:(ci*2+i)%5==0?2:0];
 const w=sh==="tall"?600:800,h=sh==="tall"?900:sh==="wide"?500:600;
 data.push({t,c,sh,src:"data:image/svg+xml,"+encodeURIComponent(scene(c,i+ci*3,w,h)),n:`${i+1} of 3 in ${c}`});
}));
const grid=document.getElementById("grid"),fbar=document.getElementById("filters");
let visible=data.map((_,i)=>i),cur=0,lastFocus=null;
data.forEach((d,i)=>{
 const b=document.createElement("button");b.className="item "+d.sh;b.dataset.cat=d.c;b.dataset.i=i;
 b.setAttribute("aria-label","Open "+d.t);
 b.innerHTML=`<img src="${d.src}" alt="${d.t}, ${d.c.toLowerCase()} landscape" loading="lazy"><span class="cap"><b>${d.t}</b><span>${d.c}</span></span>`;
 b.onclick=()=>open(i);grid.appendChild(b);
});
["All",...Object.keys(names)].forEach((c,k)=>{
 const b=document.createElement("button");b.textContent=c;b.setAttribute("aria-pressed",k===0);
 b.onclick=()=>filter(c,b);fbar.appendChild(b);
});
function filter(c,btn){
 fbar.querySelectorAll("button").forEach(x=>x.setAttribute("aria-pressed",x===btn));
 visible=[];
 grid.querySelectorAll(".item").forEach(el=>{
  const show=c==="All"||el.dataset.cat===c;
  if(show){visible.push(+el.dataset.i);el.hidden=false;requestAnimationFrame(()=>el.classList.remove("out"))}
  else{el.classList.add("out");setTimeout(()=>{if(el.classList.contains("out"))el.hidden=true},300)}
 });
}
const lb=document.getElementById("lb"),img=document.getElementById("lbimg");
function show(i,animate){
 cur=i;const d=data[i];
 const apply=()=>{img.src=d.src;img.alt=d.t+", "+d.c.toLowerCase()+" landscape";
  document.getElementById("lbt").textContent=d.t;
  document.getElementById("lbm").textContent=`${visible.indexOf(i)+1} of ${visible.length} · ${d.c}`;img.classList.remove("swap")};
 if(animate){img.classList.add("swap");setTimeout(apply,200)}else apply();
}
function open(i){lastFocus=document.activeElement;show(i,false);lb.classList.add("open");document.getElementById("close").focus()}
function close(){lb.classList.remove("open");if(lastFocus)lastFocus.focus()}
function step(dir){const p=visible.indexOf(cur);show(visible[(p+dir+visible.length)%visible.length],true)}
document.getElementById("next").onclick=()=>step(1);
document.getElementById("prev").onclick=()=>step(-1);
document.getElementById("close").onclick=close;
lb.addEventListener("click",e=>{if(e.target===lb)close()});
document.addEventListener("keydown",e=>{
 if(!lb.classList.contains("open"))return;
 if(e.key==="Escape")close();if(e.key==="ArrowRight")step(1);if(e.key==="ArrowLeft")step(-1);
});
let sx=0;
lb.addEventListener("touchstart",e=>{sx=e.touches[0].clientX},{passive:true});
lb.addEventListener("touchend",e=>{const dx=e.changedTouches[0].clientX-sx;if(Math.abs(dx)>50)step(dx<0?1:-1)});
</script>
</body>
</html>
